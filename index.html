<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motigo — Your car's personal maintenance assistant</title>
  <meta name="description" content="Motigo helps vehicle owners understand, track, schedule and manage vehicle maintenance with automated reminders and personalized AI guidance." />

  <!-- Global Diagnostic Error Handler -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('Motigo Error:', msg, url, line, error);
      var root = document.getElementById('app-root');
      if (root && root.innerHTML.indexOf('Loading Motigo') !== -1) {
        root.innerHTML = '<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0b0f19; color:#ef4444; font-family:sans-serif; text-align:center; padding:20px;">' +
          '<h2 style="font-size:22px; font-weight:800; color:#f87171;">⚠️ Motigo Initialization Error</h2>' +
          '<p style="color:#fca5a5; max-width:500px; margin:12px 0 20px; font-size:13px; background:rgba(239,68,68,0.1); padding:12px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">' + msg + '</p>' +
          '<button onclick="location.reload()" style="background:#2563eb; color:#fff; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:700;">Refresh Page</button>' +
          '</div>';
      }
    };
  </script>

  <!-- Firebase v10 Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
  <link rel="stylesheet" href="./css/ai-assistant.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div id="app-root">
    <!-- Immediate Baseline Skeleton Page -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; padding: 20px;">
      <div style="font-size: 56px; margin-bottom: 16px;">🚗</div>
      <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Motigo</h1>
      <p style="font-size: 15px; color: #94a3b8; max-width: 400px; margin-bottom: 24px; line-height: 1.5;">
        Your car's personal maintenance assistant
      </p>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #60a5fa; background: rgba(59, 130, 246, 0.1); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.3);">
        <span>✨ Loading Motigo...</span>
      </div>
    </div>
  </div>

  <!-- Direct Application Bootstrapper -->
  <script type="module">
    import { store } from './js/state.js';
    import { UIRenderer } from './js/ui.js';

    function initApp() {
      try {
        const ui = new UIRenderer();
        ui.render();

        store.subscribe(() => {
          ui.render();
        });
      } catch (err) {
        console.error('Motigo Bootstrapper Error:', err);
        var root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = '<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0b0f19; color:#ef4444; font-family:sans-serif; text-align:center; padding:20px;">' +
            '<h2 style="font-size:22px; font-weight:800; color:#f87171;">⚠️ Motigo Render Exception</h2>' +
            '<p style="color:#fca5a5; max-width:500px; margin:12px 0 20px; font-size:13px; background:rgba(239,68,68,0.1); padding:12px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">' + err.message + '</p>' +
            '<button onclick="location.reload()" style="background:#2563eb; color:#fff; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:700;">Refresh Page</button>' +
            '</div>';
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
